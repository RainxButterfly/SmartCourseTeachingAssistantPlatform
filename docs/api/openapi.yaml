openapi: 3.0.3

info:
  title: 智能课程助教平台 API
  version: 0.14.0
  description: |
    > 作者：**星河一叶Roxy** · 开源仓库：[RainxButterfly/SmartCourseTeachingAssistantPlatform](https://github.com/RainxButterfly/SmartCourseTeachingAssistantPlatform)
    >
    > 本文件由《智能课程助教平台_PAD需求文档》v0.14 导出，是**前后端唯一共享契约**。

    ## 一、通用约定

    | 约定 | 说明 |
    |---|---|
    | 统一前缀 | `/api/v1` |
    | 字段命名 | **全链路 snake_case**（Path / Query / Body / 响应），后端 DTO 直接映射，**不存在 camelCase ↔ snake_case 转换层** |
    | 数值 ID | `user_id` / `course_id` / `material_id` / `task_id` / `attempt_id` / `question_id` 为 **number** |
    | 线路 ID | `conversation.id` / `message.id` 对外为**数字字符串**（BIGINT 主键的十进制字符串，不带 `conv_` / `msg_` 前缀），规避 JS 大整数精度问题 |
    | 日期时间 | ISO-8601 本地时间字符串，如 `2026-10-02T10:00:00`；可空字段用 `null`，**不用空串代替 null** |
    | 统一响应 | `{ code, message, data, trace_id }`；`code=0` 成功，非 0 为业务错误（见下方错误码表） |

    ## 二、请求头

    | 头 | 必填 | 说明 |
    |---|---|---|
    | `Authorization` | 是（除鉴权/健康检查） | `Bearer <access_token>` |
    | `X-Request-Id` | 是 | 前端生成的 uuid-v4，用于链路追踪 |
    | `Content-Type` | 是 | `application/json`（流式问答为 `application/json`，但需带 `Accept: text/event-stream`） |
    | `X-Idempotency-Key` | 否 | `POST /courses`、`POST /conversations` 建议附带，防重复提交 |

    ## 三、鉴权与 401 自动刷新

    - 登录 / 注册返回 `access_token`（2h）+ `refresh_token`；**注册成功即直接登录**，复用同一响应结构。
    - **refresh 轮换（写死）**：每次 `POST /auth/refresh` 都下发新的 `refresh_token`，旧的立即失效（作废 jti 写入 `t_token_blacklist`）；失败返回 `1002`。
    - 前端 401 拦截器会**自动刷新一次并重放原请求**，刷新失败才清会话跳登录页（保留 `?redirect=` 原目标）。
    - ⚠️ **因此改密码的「原密码错误」必须是 `1007`（HTTP 400），绝不能复用 `1002`** —— 否则会被 401 拦截器当作登录失效去刷新并重放，把用户误登出。

    ## 四、统一错误码

    | code | HTTP | message | 是否可自助修复 |
    |---|---|---|---|
    | 0 | 200 | ok | — |
    | 1001 | 400 | 请求参数无效 | 是 |
    | 1002 | 401 | 未登录或 token 已过期 | 是（重新登录） |
    | 1003 | 403 | 没有操作权限 | 否 |
    | 1004 | 404 | 资源不存在 | 否 |
    | 1005 | 409 | 资源已存在（如课程编号重复、邮箱已注册、作答重复提交） | 是 |
    | 1006 | 409 | 资源下存在关联子资源（需 `cascade=true` 确认） | 是 |
    | 1007 | 400 | 原密码不正确（改密码专用） | 是 |
    | 2001 | 413 | 文件超过大小限制 | 是 |
    | 2002 | 415 | 不支持的文件格式 | 是 |
    | 2003 | 400 | 解析任务已存在 | 否 |
    | 3001 | 503 | AI 服务暂不可用 | 否 |
    | 3002 | 503 | 模型调用超时 | 否 |
    | 3003 | 400 | 资料尚未解析完成 | 是（等待解析） |
    | 3004 | 503 | 尚未配置大模型，请先在设置中完成配置 | **是（去 /settings 配置）** |
    | 9000 | 500 | 系统内部错误 | 否 |

    ## 五、资料上传（MinIO 预签名三步走，写死）

    ```
    ① POST /api/v1/materials/presign     → 申请预签名凭证，后端已落 t_material(status=UPLOADING) 占位行
    ② PUT  {upload_url}                  → 前端直传 MinIO，Body = File，Headers 用 items[].headers（不走 Gateway）
    ③ POST /api/v1/materials/complete    → 上传完成确认，落库 + 投递解析任务，返回 task_id
    ```

    - 单文件 ≤ 50MB（52428800 字节）；格式仅 PDF / PPTX / DOCX / MD；`upload_url` 有效期 `expires_in=900` 秒。
    - 直传失败可对同一 `material_id` 重新申请 presign，**最多重试 3 次**。
    - `status=UPLOADING` 超 24h 的僵尸占位行 + MinIO 残留对象由定时任务回收。

    ## 六、资料状态机

    `UPLOADING`（直传中）→ `PENDING`（待解析）→ `PARSING`（解析中）→ `EMBEDDING`（向量化中）→ `READY`（已完成）/ `FAILED`（失败）

    解析任务状态：`QUEUED` → `RUNNING` → `SUCCESS` / `FAILED`

    ## 七、流式问答（SSE）

    `POST /ai/chat/stream` 返回 `text/event-stream`，事件名固定 5 个：`message_start` `message_chunk` `citation` `message_end` `error`。详见该接口说明。

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发（Java Gateway）
  - url: https://your-domain.com/api/v1
    description: 生产环境（占位，部署时替换）

tags:
  - name: 鉴权
    description: 注册 / 登录 / token 刷新 / 登出 / 当前用户 / 改密码 / 忘记密码
  - name: 课程
    description: 课程 CRUD、学期字典、课程编号唯一性预检、单课程统计
  - name: 资料
    description: MinIO 预签名上传三步走、资料列表与详情、重命名、删除、重新解析、下载、解析进度轮询
  - name: 对话
    description: 会话 CRUD、消息分页、问答反馈
  - name: AI 问答
    description: 流式问答（SSE）、中断生成、推荐问题
  - name: 智能出题
    description: 组卷、提交作答、结果解析、薄弱知识点、历史作答
  - name: 学习统计
    description: 个人总览、趋势序列、最近活动流
  - name: 系统设置
    description: BYOK 大模型配置（只写不读，仅回显掩码）
  - name: 系统运维
    description: 健康检查、版本信息

security:
  - bearerAuth: []

paths:
  # ============================== 鉴权 ==============================
  /auth/register:
    post:
      tags: [鉴权]
      operationId: register
      summary: 注册（成功即登录）
      description: |
        注册成功**直接登录**，响应与登录完全一致（复用 `LoginResponse`），前端无需再调一次登录。

        - 邮箱唯一，重复返回 `1005`（HTTP 409）
        - 密码强度：≥8 位且同时含小写字母、大写字母与数字，违规返回 `1001`
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功并已登录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: 邮箱已注册（1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                code: 1005
                message: 该邮箱已注册
                data: null
                trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071

  /auth/login:
    post:
      tags: [鉴权]
      operationId: login
      summary: 登录
      description: |
        邮箱或密码错误**一律返回 `1002`（HTTP 401，message「邮箱或密码错误」）**，不区分「邮箱不存在」与「密码错误」，避免账号枚举。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/refresh:
    post:
      tags: [鉴权]
      operationId: refreshToken
      summary: 刷新 token（refresh 轮换）
      description: |
        每次刷新都下发新的 `refresh_token`，**旧的立即失效**（作废 jti 写入 `t_token_blacklist`）。

        校验顺序：先查黑名单 → 命中即 `1002`。刷新失败返回 `1002`，前端应清会话并跳登录页。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功（已轮换）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/logout:
    post:
      tags: [鉴权]
      operationId: logout
      summary: 登出（吊销 refresh token）
      description: 吊销传入的 `refresh_token`；当前 `access_token` 进 `t_token_blacklist` 直到自然过期。成功返回 `data=null`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessNull'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/me:
    get:
      tags: [鉴权]
      operationId: getCurrentUser
      summary: 当前用户信息
      description: 按 `Authorization` 头识别当前用户，响应即 `UserVO`（与登录响应里的 `user` 同结构）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserVO'
        '401':
          $ref: '#/components/responses/Error401'

  /auth/password:
    put:
      tags: [鉴权]
      operationId: changePassword
      summary: 修改密码
      description: |
        成功后**吊销该用户全部 refresh token（含当前）**，响应 `data=null`；前端据此清空本地会话并跳登录页。

        ⚠️ **原密码不正确必须返回 `1007`（HTTP 400）**：

        - 若返回 `1002` / 401，前端 401 拦截器会尝试刷新 token 并重放请求，刷新失败后清会话 → **用户只是打错一次原密码就被登出**；
        - `1007` 在前端会就地绑定到「原密码」字段下方，不弹 toast、不放表单顶部。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessNull'
        '400':
          description: 参数非法（1001）或原密码不正确（1007）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              examples:
                invalidParam:
                  summary: 1001 新密码强度不足
                  value:
                    code: 1001
                    message: 至少 8 位，需包含大小写字母与数字
                    data: null
                    trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
                invalidOldPassword:
                  summary: 1007 原密码不正确（必须是 400，不可用 1002/401）
                  value:
                    code: 1007
                    message: 原密码不正确
                    data: null
                    trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
        '401':
          $ref: '#/components/responses/Error401'

  /auth/forgot-password:
    post:
      tags: [鉴权]
      operationId: forgotPassword
      summary: 忘记密码（发送重置邮件）
      description: |
        **无论该邮箱是否存在，都返回 `code=0` + `data=null`**（防用户枚举）；只有邮箱格式非法才返回 `1001`。

        真实后端异步发送重置邮件（链接有效期 30 分钟）；前端无论何种结果都展示同一句文案「如果该邮箱已注册，重置链接已发送，请查收」。

        前端入口在登录页的「忘记密码？」按钮（Dialog），**不新增路由**。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/SuccessNull'
        '400':
          $ref: '#/components/responses/Error400'

  # ============================== 课程 ==============================
  /courses:
    get:
      tags: [课程]
      operationId: listCourses
      summary: 课程分页列表
      description: 支持关键词、归属（我的/全部）、学期、排序筛选。列表页筛选状态会同步到 URL query（搜索词 replace、离散筛选与翻页 push）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: keyword
          in: query
          required: false
          description: 关键词，匹配课程名称或编号
          schema:
            type: string
            maxLength: 50
        - name: mine
          in: query
          required: false
          description: true=仅我创建的课程；不传或 false=全部可见课程
          schema:
            type: boolean
        - name: semester
          in: query
          required: false
          description: 学期精确匹配，取值来自 `GET /courses/semesters`
          schema:
            type: string
            maxLength: 20
        - name: sort
          in: query
          required: false
          description: 排序：recent=最近活跃、name=名称、created=创建时间
          schema:
            type: string
            enum: [recent, name, created]
            default: recent
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 课程分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CoursePage'
        '401':
          $ref: '#/components/responses/Error401'

    post:
      tags: [课程]
      operationId: createCourse
      summary: 新建课程
      description: |
        课程编号全局唯一，重复返回 `1005`。表单在编号输入框**失焦时**先调 `GET /courses/check-code` 预检，提交时仍由服务端裁决。

        建议附带 `X-Idempotency-Key` 防重复提交。成功后会写入一条 `t_activity(type=COURSE_CREATED)`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpsertRequest'
      responses:
        '200':
          description: 创建成功，返回 CourseVO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: 课程编号已占用（1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                code: 1005
                message: 该课程编号已被占用
                data: null
                trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071

  /courses/semesters:
    get:
      tags: [课程]
      operationId: listSemesters
      summary: 学期字典
      description: |
        供课程筛选与表单下拉使用，按学期**倒序**（最近的在前），`course_count` 可用于禁用空学期。

        ⚠️ 后端路由必须注册在 `/courses/{id}` **之前**；聚合时**必须过滤 `semester = ''`**（未填学期的课程不进入字典）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 学期字典
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SemesterListVO'
        '401':
          $ref: '#/components/responses/Error401'

  /courses/check-code:
    get:
      tags: [课程]
      operationId: checkCourseCode
      summary: 课程编号唯一性预检
      description: |
        表单「失焦即校验」调用。`available=false` 时携带冲突课程，供前端给出「该课程编号已被《操作系统》占用」这类精准提示。

        ⚠️ 后端路由必须注册在 `/courses/{id}` **之前**。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: code
          in: query
          required: true
          description: 待校验的课程编号
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{2,32}$'
        - name: exclude_id
          in: query
          required: false
          description: 编辑态传当前课程 id，排除自身
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 预检结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CodeCheckVO'

  /courses/{id}:
    get:
      tags: [课程]
      operationId: getCourseDetail
      summary: 课程详情（含统计概览）
      description: 返回 `CourseDetailVO` = `CourseVO` + `stats`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 课程详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseDetailVO'
        '404':
          $ref: '#/components/responses/Error404'

    put:
      tags: [课程]
      operationId: updateCourse
      summary: 编辑课程
      description: 请求体与新建一致（全量覆盖）。课程编号重复返回 `1005`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpsertRequest'
      responses:
        '200':
          description: 更新成功，返回 CourseVO
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseVO'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'

    delete:
      tags: [课程]
      operationId: deleteCourse
      summary: 删除课程（级联校验）
      description: |
        课程下仍有资料或会话时返回 `1006`（HTTP 409），且 `data` 携带子资源数量，供前端弹二次确认；带 `cascade=true` 再删则连同子资源一起删除。

        删除课程需**异步补偿**清理 MinIO 对象与 Milvus 向量（MQ 投递，失败进重试队列）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PathId'
        - name: cascade
          in: query
          required: false
          description: true=级联删除课程下的资料与会话
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DeleteResultVO'
        '409':
          description: 课程下仍有子资源（1006）；`data` 为子资源数量，前端据此提示
          content:
            application/json:
              schema:
                allOf:
