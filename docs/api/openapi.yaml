                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuizGenerateVO'
        '400':
          $ref: '#/components/responses/Error400'

  /quiz/attempts:
    post:
      tags: [智能出题]
      operationId: submitQuiz
      summary: 提交作答
      description: |
        - `answers` 的 key 为 `String(question_id)`，**未作答的题不出现该键**；
        - 作答值：`SINGLE` / `FILL` / `ESSAY` 为字符串，`MULTIPLE` 为字符串数组；
        - **选择题的作答值用「选项文本」而非 A/B/C/D 字母**（与 `options` 数组元素完全一致），避免标号与顺序耦合；
        - `ESSAY` 由模型评分，**评分 ≥ 0.6 视为正确**（阈值可配置），DTO 只暴露布尔 `correct`；
        - 同一 `attempt_id` **只允许提交一次**，重复提交返回 `1005`（HTTP 409）；
        - 交卷成功写入一条 `t_activity(type=QUIZ_SUBMITTED)`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizSubmitRequest'
      responses:
        '200':
          description: 判分结果（逐题解析）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuizResultVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          description: 该作答已提交（1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'

    get:
      tags: [智能出题]
      operationId: listQuizAttempts
      summary: 历史作答记录（分页）
      description: '**只列已提交记录**（进行中的作答不出现）。'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: course_id
          in: query
          required: false
          description: 按课程过滤；省略表示全部
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 作答记录分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuizAttemptPage'

  /quiz/attempts/{id}:
    get:
      tags: [智能出题]
      operationId: getQuizResult
      summary: 作答结果（逐题解析）
      description: |
        ⚠️ 仅对**已提交**的作答开放；未提交返回 `1001`（避免提前拿到答案）。作答不存在返回 `1004`。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: 结果详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/QuizResultVO'
        '400':
          $ref: '#/components/responses/Error400'
        '404':
          $ref: '#/components/responses/Error404'

  /quiz/weak-points:
    get:
      tags: [智能出题]
      operationId: listWeakPoints
      summary: 薄弱知识点排行
      description: 按掌握度 `score` **升序**返回（越低越薄弱），最多 20 条。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: course_id
          in: query
          required: false
          description: 按课程过滤；省略表示全部
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        '200':
          description: 薄弱点列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WeakPointListVO'

  # ============================== 学习统计 ==============================
  /stats/overview:
    get:
      tags: [学习统计]
      operationId: getStatsOverview
      summary: 个人总览（概览卡片）
      description: '`qa_accuracy` / `quiz_accuracy` 取值 0~1（ratio），由前端转百分比展示。'
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 总览指标
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StatsOverviewVO'

  /stats/trend:
    get:
      tags: [学习统计]
      operationId: getStatsTrend
      summary: 趋势序列
      description: |
        全部为「当前用户」维度：

        | type | 语义 | unit | 图表类型 |
        |---|---|---|---|
        | `study_time` | 每日学习时长 | `minute` | 柱状图 |
        | `quiz_accuracy` | 每日答题正确率 | `ratio`（0~1） | 折线图 |
        | `qa_hit_rate` | 命中 / 未命中占比 | `ratio` | **饼图**（`series` 固定两个分类「命中资料」/「未命中资料」，该 type **忽略 `range`**） |
        | `material_growth` | 每日累计资料数 | `count` | 面积图 |

        `series[].label` 为展示刻度（如 `09-26`），`value` 为数值。**前端不硬编码 `unit`**，一律按响应里的 `unit` 格式化（`minute` → `x 分钟`、`ratio` → `x%`、`count` → `x`）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: type
          in: query
          required: true
          description: 趋势类型
          schema:
            type: string
            enum: [study_time, quiz_accuracy, qa_hit_rate, material_growth]
        - name: range
          in: query
          required: false
          description: 时间范围；`qa_hit_rate` 忽略该字段
          schema:
            type: string
            enum: [week, month]
            default: week
      responses:
        '200':
          description: 趋势序列
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TrendVO'
        '400':
          $ref: '#/components/responses/Error400'

  /stats/activities:
    get:
      tags: [学习统计]
      operationId: getStatsActivities
      summary: 最近活动流
      description: |
        按时间倒序。`title` 由后端在**写入时**拼好并落库，前端直接展示、**不解析 `payload`**，避免文案与数据结构耦合。

        只会有 5 类 `type`：`COURSE_CREATED`、`MATERIAL_UPLOADED`、`MATERIAL_DELETED`、`QUIZ_SUBMITTED`、`CHAT_ASKED`（前端只按 `type` 选图标）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
        - name: limit
          in: query
          required: false
          description: 返回条数（首页活动流用 6，统计页用 10）
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 活动流
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ActivityListVO'

  # ============================== 系统设置 ==============================
  /settings/model:
    get:
      tags: [系统设置]
      operationId: getModelConfig
      summary: 读取大模型配置
      description: |
        **API Key 只写不读**：接口永不返回明文，只回显掩码（如 `sk-****f3a1`）；未配置时 `api_key_masked` 为 `""`、`has_api_key` 为 `false`。

        配置由后端写入受权限保护的**本地配置文件**（如 `config/model-provider.json`，`0600`），**不落 MySQL**，且不得写入日志或打进镜像。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: 当前配置（密钥为掩码）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ModelConfigVO'

    put:
      tags: [系统设置]
      operationId: saveModelConfig
      summary: 保存大模型配置
      description: |
        后端写入本地配置文件（Python AI 侧按文件 mtime 缓存读取，保存后立即生效、无需重启）。

        `api_key` **省略或传 `""` 表示保留已保存的密钥**；传新值则覆盖。成功响应同样只回显掩码。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfigRequest'
      responses:
        '200':
          description: 保存成功，返回最新配置（掩码）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ModelConfigVO'
        '400':
          $ref: '#/components/responses/Error400'

  /settings/model/test:
    post:
      tags: [系统设置]
      operationId: testModelConnection
      summary: 测试连接（探活）
      description: 用当前表单值探活一次（`api_key` 省略则用已保存的），**不落配置**。失败时 `ok=false` 并在 `message` 给出可读原因（Key 无效 / 地址不可达 / 模型不存在），HTTP 仍为 200。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfigRequest'
      responses:
        '200':
          description: 探活结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ModelTestVO'

  # ============================== 系统运维 ==============================
  /health:
    get:
      tags: [系统运维]
      operationId: health
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthVO'

  /actuator/info:
    get:
      tags: [系统运维]
      operationId: actuatorInfo
      summary: 版本信息
      security: []
      responses:
        '200':
          description: 版本信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AppInfoVO'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '登录 / 注册返回的 `access_token`，通过 `Authorization: Bearer <token>` 传递。'

  parameters:
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 前端生成的 uuid-v4，用于链路追踪；响应里的 `trace_id` 与之对应。（后端建议做成必填校验）
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: 幂等键，防止重复提交产生多条记录。
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      description: 每页条数（上限 50）
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    PathId:
      name: id
      in: path
      required: true
      description: 资源主键（数值型 BIGINT）
      schema:
        type: integer
        format: int64
    WirePathId:
      name: id
      in: path
      required: true
      description: 会话 / 消息主键，**对外为数字字符串**（避免 JS 大整数精度问题）
      schema:
        type: string
        pattern: '^\d+$'

  responses:
    SuccessNull:
      description: 操作成功，无业务数据
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    nullable: true
                    description: 恒为 null
                    example: null
    Error400:
      description: 请求参数无效（1001），或原密码不正确（1007，仅改密码）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 1001
            message: 请求参数无效
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error401:
      description: 未登录或 token 已过期（1002）。前端会自动刷新一次并重放，刷新失败才清会话跳登录页。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 1002
            message: 未登录或 token 已过期
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error403:
      description: 没有操作权限（1003）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 1003
            message: 没有操作权限
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error404:
      description: 资源不存在（1004）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 1004
            message: 资源不存在
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error409:
      description: 资源已存在（1005）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 1005
            message: 资源已存在
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error413:
      description: 文件超过大小限制（2001，单文件上限 50MB）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 2001
            message: 文件超过大小限制
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error415:
      description: 不支持的文件格式（2002，仅 PDF / PPTX / DOCX / MD）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 2002
            message: 不支持的文件格式
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071
    Error500:
      description: 系统内部错误（9000）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiEnvelope'
          example:
            code: 9000
            message: 系统内部错误
            data: null
            trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071

  schemas:
    # ---------------------- 通用 ----------------------
    ApiEnvelope:
      type: object
      description: 统一响应包装。`code=0` 成功，非 0 为业务错误（见「统一错误码」）。
      required: [code, message, data, trace_id]
      properties:
        code:
          type: integer
          format: int32
          description: 业务错误码，0 表示成功
          example: 0
        message:
          type: string
          description: 提示文案，成功时恒为 ok；失败时为可读原因
          example: ok
        data:
          description: 业务数据，结构随接口而异；失败时为 null
          nullable: true
        trace_id:
          type: string
          nullable: true
          description: 链路追踪 ID（uuid-v4），与请求头 X-Request-Id 对应
          example: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071

    DeleteResultVO:
      type: object
      description: 数值型主键资源的删除结果
      required: [id, deleted]
      properties:
        id:
          type: integer
          format: int64
          description: 被删除资源的数值主键
        deleted:
          type: boolean
          description: 是否删除成功，恒为 true
          example: true

    DeleteWireResultVO:
      type: object
      description: 会话（数字字符串主键）的删除结果
      required: [id, deleted]
      properties:
        id:
          type: string
          description: 被删除会话的 ID（数字字符串）
        deleted:
          type: boolean
          description: 是否删除成功，恒为 true
          example: true

    ChildrenConflictVO:
      type: object
      description: 课程删除前的级联校验载荷（错误码 1006 的 `data`）
      required: [material_count, conversation_count]
      properties:
        material_count:
          type: integer
          format: int32
          description: 课程下的资料数量
          example: 12
        conversation_count:
          type: integer
          format: int32
          description: 课程下的会话数量
          example: 5

    HealthVO:
      type: object
      description: 健康检查结果
      properties:
        status:
          type: string
          description: 服务状态
          example: UP

    AppInfoVO:
      type: object
      description: 应用版本信息
      properties:
        name:
          type: string
          description: 应用名
          example: smart-course-ta
        version:
          type: string
          description: 后端版本号
          example: 0.14.0
        author:
          type: string
          description: 作者
          example: 星河一叶Roxy

    # ---------------------- 鉴权 ----------------------
    UserVO:
      type: object
      description: 用户信息。登录 / 注册响应的 `user` 与 `GET /auth/me` 共用同一结构。
      required: [id, username, avatar, email]
      properties:
        id:
          type: integer
          format: int64
          description: 用户 ID
          example: 1
        username:
          type: string
          description: 用户名（2-20 字）
          example: 张三
        avatar:
          type: string
          nullable: true
          description: 头像 URL，无头像为 null
          example: null
        email:
          type: string
          format: email
          description: 登录邮箱（全局唯一）
          example: demo@example.com

    AuthTokens:
      type: object
      description: token 对。`refresh_token` 每次刷新都会轮换。
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token:
          type: string
          description: 访问令牌（JWT），放入 Authorization 头
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: 刷新令牌（JWT），用于换取新的 access_token；用掉即失效
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        expires_in:
          type: integer
          format: int32
          description: access_token 有效期（秒），当前为 7200（2 小时）
          example: 7200

    LoginResponse:
      type: object
      description: 登录 / 注册响应。注册成功即登录，复用同一结构。
      required: [access_token, refresh_token, expires_in, user]
      properties:
        access_token:
          type: string
          description: 访问令牌（JWT）
        refresh_token:
          type: string
          description: 刷新令牌（JWT）
        expires_in:
          type: integer
          format: int32
          description: access_token 有效期（秒）
          example: 7200
        user:
          $ref: '#/components/schemas/UserVO'

    RegisterRequest:
      type: object
      description: 注册请求
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          description: 登录邮箱，全局唯一；重复返回 1005
          example: s@x.com
        username:
          type: string
          minLength: 2
          maxLength: 20
          description: 用户名，2-20 字
          example: 张三
        password:
          type: string
          minLength: 8
          description: 密码，≥8 位且同时含小写字母、大写字母与数字
          example: Abc@1234

    LoginRequest:
      type: object
      description: 登录请求
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: 登录邮箱
          example: demo@example.com
        password:
          type: string
          description: 密码
          example: Demo@1234

    RefreshRequest:
      type: object
      description: 刷新 token 请求
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 待轮换的 refresh_token；用过的立即失效
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    LogoutRequest:
      type: object
      description: 登出请求
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: 待吊销的 refresh_token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    ChangePasswordRequest:
      type: object
      description: 修改密码请求
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          description: 原密码；不正确返回 1007（HTTP 400），**不可用 1002 代替**
          example: Demo@1234
        new_password:
          type: string
          minLength: 8
          description: 新密码，≥8 位且同时含小写字母、大写字母与数字；违规返回 1001
          example: New@1234

    ForgotPasswordRequest:
      type: object
      description: 忘记密码请求
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: 注册邮箱。无论是否存在都返回 code=0（防用户枚举）；仅格式非法返回 1001
          example: s@x.com

    # ---------------------- 课程 ----------------------
    CourseVO:
      type: object
      description: 课程视图对象
      required:
        - id
        - name
        - code
        - semester
        - teacher
        - color
        - description
        - visibility
        - owner_id
        - owner_name
        - material_count
        - conversation_count
        - last_active_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          description: 课程 ID
          example: 1
        name:
          type: string
          description: 课程名称，2-50 字
          example: 操作系统
        code:
          type: string
          description: 课程编号，2-32 位字母/数字/下划线/中划线，**全局唯一**
          example: OS2026
        semester:
          type: string
          description: 学期，最长 20 字；未填为空串
          example: 2026秋
        teacher:
          type: string
          description: 任课教师，最长 50 字；未填为空串
          example: 李老师
        color:
          type: string
          description: 封面主题色，6 位 HEX
          example: '#7c9cff'
        description:
          type: string
          description: 课程简介，最长 200 字；未填为空串
          example: 进程、内存与文件系统
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
          description: 可见性。PRIVATE=仅自己可见；PUBLIC=列表中对所有人可见
          example: PRIVATE
        owner_id:
          type: integer
          format: int64
          description: 创建者用户 ID
          example: 1
        owner_name:
          type: string
          description: 创建者用户名
          example: 张三
        material_count:
          type: integer
          format: int32
          description: 课程下的资料数量
          example: 12
        conversation_count:
          type: integer
          format: int32
          description: 课程下的会话数量
          example: 5
        last_active_at:
          type: string
          nullable: true
          description: 最近活跃时间；从未活跃为 null
          example: '2026-10-02T10:00:00'
        created_at:
          type: string
          description: 创建时间
          example: '2026-10-01T09:00:00'
        updated_at:
          type: string
          description: 更新时间
          example: '2026-10-02T10:00:00'

    CourseStatsVO:
      type: object
      description: 单课程统计概览
      required:
        - material_count
        - ready_material_count
        - conversation_count
        - question_count
        - quiz_accuracy
        - last_active_at
      properties:
        material_count:
          type: integer
          format: int32
          description: 资料总数
          example: 12
        ready_material_count:
          type: integer
          format: int32
          description: 已完成解析（READY）的资料数
          example: 10
        conversation_count:
          type: integer
          format: int32
          description: 会话总数
          example: 5
        question_count:
          type: integer
          format: int32
          description: 累计提问数
          example: 88
        quiz_accuracy:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 该课程练习正确率（0~1）
          example: 0.76
        last_active_at:
          type: string
          nullable: true
          description: 最近活跃时间
          example: '2026-10-02T10:00:00'

    CourseDetailVO:
      type: object
      description: 课程详情 = CourseVO 全部字段 + stats
      allOf:
        - $ref: '#/components/schemas/CourseVO'
        - type: object
          required: [stats]
          properties:
            stats:
              $ref: '#/components/schemas/CourseStatsVO'

    CourseUpsertRequest:
      type: object
      description: 新建 / 编辑课程请求（编辑为全量覆盖）
      required: [name, code]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          description: 课程名称，2-50 字
          example: 操作系统
        code:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,32}$'
          description: 课程编号，2-32 位字母/数字/下划线/中划线，全局唯一
          example: OS2026
        semester:
          type: string
          maxLength: 20
          default: ''
          description: 学期；可自由输入，也可取 `GET /courses/semesters` 的字典值
          example: 2026秋
        teacher:
          type: string
          maxLength: 50
          default: ''
          description: 任课教师
          example: 李老师
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          default: '#7c9cff'
          description: 封面主题色（6 位 HEX）
          example: '#7c9cff'
        description:
          type: string
          maxLength: 200
          default: ''
          description: 课程简介，不超过 200 字
          example: 进程、内存与文件系统
        visibility:
          type: string
          enum: [PRIVATE, PUBLIC]
          default: PRIVATE
          description: 可见性
          example: PRIVATE

    CoursePage:
      type: object
      description: 课程分页结果
      required: [list, total, page, size]
      properties:
        list:
          type: array
          description: 当前页课程
          items:
            $ref: '#/components/schemas/CourseVO'
        total:
          type: integer
          format: int64
          description: 满足条件的总条数
          example: 24
        page:
          type: integer
          format: int32
          description: 当前页码（从 1 开始）
          example: 1
        size:
          type: integer
          format: int32
          description: 每页条数
          example: 12

    SemesterOption:
      type: object
      description: 学期字典项
      required: [value, course_count]
      properties:
        value:
          type: string
          description: 学期值，如 2026秋
          example: 2026秋
        course_count:
          type: integer
          format: int32
          description: 该学期下的课程数，0 可用于禁用选项
          example: 4

    SemesterListVO:
      type: object
      description: 学期字典（按学期倒序，已过滤空学期）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SemesterOption'

    CodeCheckVO:
      type: object
      description: 课程编号唯一性预检结果
      required: [code, available]
      properties:
        code:
          type: string
          description: 被校验的课程编号
          example: OS2026
        available:
          type: boolean
          description: 是否可用（true=未被占用）
          example: false
        conflict_course_id:
          type: integer
          format: int64
          nullable: true
          description: 冲突课程 ID；available=true 时为 null
          example: 1
        conflict_course_name:
          type: string
          nullable: true
          description: 冲突课程名称，用于拼「已被《操作系统》占用」
          example: 操作系统

    # ---------------------- 资料 ----------------------
    MaterialVO:
      type: object
      description: 资料视图对象（MinIO 对象锚点）
      required:
        - id
        - course_id
        - name
        - original_name
        - object_key
        - size_bytes
        - page_count
        - format
        - status
        - error_msg
        - version
        - chunk_count
        - uploaded_by
        - uploaded_by_name
        - created_at
      properties:
        id:
          type: integer
          format: int64
          description: 资料 ID
          example: 1
        course_id:
          type: integer
          format: int64
          description: 所属课程 ID
          example: 1
        name:
          type: string
          description: 展示名（可被重命名），最长 255 字
          example: 第3章 内存管理.pdf
        original_name:
          type: string
          description: 上传时的原始文件名，不可修改
          example: 第3章 内存管理.pdf
        object_key:
          type: string
          description: MinIO 对象键，最长 512 字
          example: course/1/2026/10/7f3a9c1e.pdf
        size_bytes:
          type: integer
          format: int64
          description: 文件字节数
          example: 2340000
        page_count:
          type: integer
          format: int32
          description: 页数（解析后回填），未解析为 0
          example: 42
        format:
          type: string
          enum: [PDF, PPTX, DOCX, MD]
          description: 文件格式
          example: PDF
        status:
          type: string
          enum: [UPLOADING, PENDING, PARSING, EMBEDDING, READY, FAILED]
          description: 资料状态机：上传中 → 待解析 → 解析中 → 向量化中 → 已完成 / 失败
          example: READY
        error_msg:
          type: string
          nullable: true
          description: 失败原因；非 FAILED 状态为 null
          example: null
        version:
          type: integer
          format: int32
          description: 版本号，从 1 开始（重新上传或重新解析递增）
          example: 1
        chunk_count:
          type: integer
          format: int32
          description: 切片数（向量化完成后回填）
          example: 320
        uploaded_by:
          type: integer
          format: int64
          description: 上传者用户 ID
          example: 1
        uploaded_by_name:
          type: string
          description: 上传者用户名
          example: 张三
        created_at:
          type: string
          description: 上传时间
          example: '2026-10-02T09:00:00'
        sha256:
          type: string
          nullable: true
          description: 文件 SHA-256（用于秒传/去重），未提供为 null
          example: null
        upload_batch_id:
          type: string
          nullable: true
          description: 所属上传批次号（同一次 presign 的多个文件共享）
          example: batch_20261002T100000_7f3a

    MaterialPage:
      type: object
      description: 资料分页结果
      required: [list, total, page, size]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/MaterialVO'
        total:
          type: integer
          format: int64
          description: 总条数
          example: 12
        page:
          type: integer
          format: int32
          description: 当前页码
          example: 1
        size:
          type: integer
          format: int32
          description: 每页条数（列表默认 10）
          example: 10

    PresignRequest:
      type: object
      description: 申请预签名凭证（上传第一步）
      required: [course_id, files]
      properties:
        course_id:
          type: integer
          format: int64
          description: 目标课程 ID
          example: 1
        files:
          type: array
          minItems: 1
          maxItems: 10
          description: 待上传文件清单，单次最多 10 个
          items:
            type: object
            required: [client_file_id, original_name, size_bytes, content_type]
            properties:
              client_file_id:
                type: string
                maxLength: 64
                description: 前端本次上传的临时标识，用于把 presign 结果与本地 File 对上
                example: tmp_1
              original_name:
                type: string
                maxLength: 255
                description: 原始文件名（含扩展名，用于推断格式）
                example: 第3章 内存管理.pdf
              size_bytes:
                type: integer
                format: int64
                description: 文件字节数，单文件上限 52428800（50MB）；超限返回 2001
                example: 2340000
              content_type:
                type: string
                description: 文件 MIME 类型，会原样写入预签名头的 Content-Type
                example: application/pdf
              sha256:
                type: string
                length: 64
                nullable: true
                description: 文件 SHA-256（可选，用于秒传/去重）
                example: null

    PresignResponse:
      type: object
      description: 预签名凭证响应
      required: [upload_batch_id, expires_in, items]
      properties:
        upload_batch_id:
          type: string
          description: 上传批次号，第三步 complete 需回传
          example: batch_20261002T100000_7f3a
        expires_in:
          type: integer
          format: int32
          description: upload_url 有效期（秒），固定 900
          example: 900
        items:
          type: array
          description: 每个文件一条预签名信息，与请求的 files 按 client_file_id 对应
          items:
            type: object
            required:
              - client_file_id
              - material_id
              - object_key
              - upload_url
              - method
              - headers
              - max_size_bytes
            properties:
              client_file_id:
                type: string
                description: 回显请求里的临时标识
                example: tmp_1
              material_id:
                type: integer
                format: int64
                description: 后端预分配的资料 ID（此时 t_material.status=UPLOADING）
                example: 101
              object_key:
                type: string
                description: MinIO 对象键（第三步 complete 校验用）
                example: course/1/2026/10/7f3a9c1e.pdf
              upload_url:
                type: string
                description: 预签名 PUT URL，前端直接 PUT 该地址（不走 Gateway）
                example: https://minio.internal/sc-ta/course/1/...&X-Amz-Signature=...
              method:
                type: string
                enum: [PUT]
                description: 固定为 PUT
                example: PUT
              headers:
                type: object
                additionalProperties:
                  type: string
                description: 直传时必须原样携带的请求头（如 Content-Type）
                example:
                  Content-Type: application/pdf
              max_size_bytes:
                type: integer
                format: int64
                description: 允许的最大字节数，固定 52428800（50MB）
                example: 52428800

    CompleteRequest:
      type: object
      description: 上传完成确认（上传第三步）
      required: [upload_batch_id, items]
      properties:
        upload_batch_id:
          type: string
          description: presign 返回的批次号
          example: batch_20261002T100000_7f3a
        items:
          type: array
          minItems: 1
          description: 已成功直传的文件清单
          items:
            type: object
            required: [client_file_id, material_id]
            properties:
              client_file_id:
                type: string
                description: 前端临时标识
                example: tmp_1
              material_id:
                type: integer
                format: int64
                description: presign 返回的资料 ID
                example: 101
              etag:
                type: string
                nullable: true
                description: MinIO 返回的 ETag（可选）
                example: '"9c1e"'
              sha256:
                type: string
                nullable: true
                description: 文件 SHA-256（可选，用于二次校验）
                example: null

    UploadVO:
      type: object
      description: 上传受理结果
      required: [task_id, material_ids, status]
      properties:
        task_id:
          type: integer
          format: int64
          description: 解析任务 ID，可用 `GET /materials/{id}/parse-status` 轮询
          example: 101
        material_ids:
          type: array
          description: 本次受理的资料 ID 列表
          items:
            type: integer
            format: int64
          example: [101, 102]
        status:
          type: string
          enum: [QUEUED]
          description: 解析任务初始状态，固定为 QUEUED
          example: QUEUED

    DownloadVO:
      type: object
      description: 预签名下载地址
      required: [material_id, url, file_name, expires_in]
      properties:
        material_id:
          type: integer
          format: int64
          description: 资料 ID
          example: 1
        url:
          type: string
          description: 预签名 GET URL，前端直接跳转/下载
          example: https://minio.internal/sc-ta/course/1/...&X-Amz-Signature=...
        file_name:
          type: string
          description: 下载时的文件名
          example: 第3章 内存管理.pdf
        expires_in:
          type: integer
          format: int32
          description: URL 有效期（秒），固定 900
          example: 900

    MaterialRenameRequest:
      type: object
      description: 重命名资料请求
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: 新的展示名
          example: 第3章 内存管理（修订版）.pdf

    ParseStatusVO:
      type: object
      description: 解析任务状态（前端轮询）
      required:
        - task_id
        - material_id
        - status
        - progress
        - total_chunks
        - indexed_chunks
        - stage
        - error_msg
        - started_at
        - finished_at
      properties:
        task_id:
          type: integer
          format: int64
          description: 解析任务 ID
          example: 101
        material_id:
          type: integer
          format: int64
          description: 资料 ID
          example: 1
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCESS, FAILED]
          description: 解析任务状态
          example: RUNNING
        progress:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 进度百分比（0-100）
          example: 65
        total_chunks:
          type: integer
          format: int32
          description: 切片总数（解析完成后回填）
          example: 320
        indexed_chunks:
          type: integer
          format: int32
          description: 已向量化的切片数
          example: 208
        stage:
          type: string
          description: 展示用阶段文案，如「向量化中」
          example: 向量化中
        error_msg:
          type: string
          nullable: true
          description: 失败原因；成功或进行中为 null
          example: null
        started_at:
          type: string
          nullable: true
          description: 开始时间；未开始为 null
          example: '2026-10-02T10:00:00'
        finished_at:
          type: string
          nullable: true
          description: 结束时间；未结束为 null
          example: null

    # ---------------------- 对话 ----------------------
    ConversationVO:
      type: object
      description: 会话视图对象
      required:
        - id
        - title
        - course_id
        - course_name
        - message_count
        - last_message_at
        - created_at
      properties:
        id:
          type: string
          description: 会话 ID，**数字字符串**（非数值）
          example: '123'
        title:
          type: string
          maxLength: 100
          description: 会话标题，最长 100 字
          example: 内存管理相关问题
        course_id:
          type: integer
          format: int64
          minimum: 0
          description: 检索范围课程 ID；**0 表示全部资料**
          example: 1
        course_name:
          type: string
          description: 课程名称；course_id=0 时为空串或「全部资料」
          example: 操作系统
        message_count:
          type: integer
          format: int32
          description: 消息条数
          example: 8
        last_message_at:
          type: string
          nullable: true
          description: 最近一条消息时间；无消息为 null
          example: '2026-10-02T10:05:00'
        created_at:
          type: string
          description: 创建时间
          example: '2026-10-02T10:00:00'

    CreateConversationRequest:
      type: object
      description: 新建会话请求（接口保留，前端主流程不预先调用）
      properties:
        course_id:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 检索范围课程 ID；0 = 全部资料
          example: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 会话标题；省略则由后端生成（默认「新对话」）
          example: 新对话

    RenameConversationRequest:
      type: object
      description: 重命名会话请求
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: 新标题，1-100 字
          example: 分页与分段相关问题

    ConversationPage:
      type: object
      description: 会话分页结果
      required: [list, total, page, size]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ConversationVO'
        total:
          type: integer
          format: int64
          description: 总条数
        page:
          type: integer
          format: int32
          description: 当前页码
        size:
          type: integer
          format: int32
          description: 每页条数

    CitationVO:
      type: object
      description: 引用来源。对应 SSE `citation` 事件，同时是 `t_message.citations`(JSON) 的元素结构。
      required: [index, material_id, title, page, snippet]
      properties:
        index:
          type: integer
          format: int32
          minimum: 1
          description: 引用序号，从 1 开始（正文里以 [1] 标注）
          example: 1
        material_id:
          type: integer
          format: int64
          description: 来源资料 ID
          example: 1
        title:
          type: string
          description: 来源资料名
          example: 操作系统笔记.pdf
        page:
          type: integer
          format: int32
          minimum: 0
          description: 页码（无页码概念时为 0）
          example: 12
        snippet:
          type: string
          description: 命中片段原文
          example: 分页把逻辑地址空间切成固定大小的页…
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 相似度得分（0~1），仅 SSE citation 事件携带
          example: 0.83

    MessageVO:
      type: object
      description: 消息视图对象
      required: [id, conversation_id, role, content, tokens, citations, feedback, created_at]
      properties:
        id:
          type: string
          description: 消息 ID，**数字字符串**
          example: '456'
        conversation_id:
          type: string
          description: 所属会话 ID，**数字字符串**
          example: '123'
        role:
          type: string
          enum: [USER, ASSISTANT, SYSTEM]
          description: 消息角色
          example: ASSISTANT
        content:
          type: string
          description: 消息正文（Markdown）
          example: RAG 的核心是检索增强生成…
        tokens:
          type: integer
          format: int32
          description: token 消耗（USER 消息通常为 0）
          example: 328
        citations:
          type: array
          description: 引用来源列表（USER 消息为空数组）
          items:
            $ref: '#/components/schemas/CitationVO'
        feedback:
          type: string
          nullable: true
          enum: [UP, DOWN]
          description: 当前反馈状态；null 表示未反馈（仅 ASSISTANT 消息有意义）
          example: UP
        created_at:
          type: string
          description: 创建时间
          example: '2026-10-02T10:00:05'

    MessagePage:
      type: object
      description: 消息分页结果
      required: [list, total, page, size]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/MessageVO'
        total:
          type: integer
          format: int64
          description: 总条数
        page:
          type: integer
          format: int32
          description: 当前页码
        size:
          type: integer
          format: int32
          description: 每页条数（默认 50）

    FeedbackRequest:
      type: object
      description: 问答反馈请求（幂等替换）
      required: [rating]
      properties:
        rating:
          type: string
          nullable: true
          enum: [UP, DOWN]
          description: 反馈类型；**传 null 即取消反馈**
          example: UP
        comment:
          type: string
          maxLength: 500
          description: 补充说明，不超过 500 字；仅在 rating 非空时有意义
          example: 这个回答很有帮助

    FeedbackVO:
      type: object
      description: 反馈结果（回传最新状态，前端据此校正按钮态）
      required: [message_id, feedback]
      properties:
        message_id:
          type: string
          description: 消息 ID，**数字字符串**
          example: '456'
        feedback:
          type: string
          nullable: true
          enum: [UP, DOWN]
          description: 最新反馈状态；取消后为 null
          example: UP

    # ---------------------- AI 问答 ----------------------
    ChatRequest:
      type: object
      description: 流式问答请求
      required: [course_id, question]
      properties:
        conversation_id:
          type: string
          description: 会话 ID（数字字符串）；**为空则后端新建会话，并在 `message_start` 事件回传**
          example: '123'
        course_id:
          type: integer
          format: int64
          minimum: 0
          description: 检索范围课程 ID；**0 表示全部资料**
          example: 1
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: 用户问题，不超过 2000 字
          example: 什么是分页机制？
        history_limit:
          type: integer
          format: int32
          minimum: 0
          maximum: 20
          default: 6
          description: 携带最近 N 轮上下文，默认 6，上限 20
          example: 6

    AbortChatRequest:
      type: object
      description: 中断生成请求
      required: [conversation_id]
      properties:
        conversation_id:
          type: string
          description: 要中断的会话 ID（数字字符串）
          example: '123'

    AbortVO:
      type: object
      description: 中断受理结果
      required: [aborted]
      properties:
        aborted:
          type: boolean
          description: 是否已受理中断
          example: true

    SuggestionsVO:
      type: object
      description: 推荐问题列表
      required: [items]
      properties:
        items:
          type: array
          description: 推荐问题文本
          items:
            type: string
          example: ['分页与分段有什么区别？', '什么是缺页中断？']

    SseMessageStartData:
      type: object
      description: 'SSE `message_start` 事件的 data'
      required: [message_id, conversation_id, created_at]
      properties:
        message_id:
          type: string
          description: 本次回答的消息 ID（数字字符串）
          example: '456'
        conversation_id:
          type: string
          description: 会话 ID（数字字符串）；请求未传时由后端新建并在此回传
          example: '123'
        created_at:
          type: string
          description: 消息创建时间
          example: '2026-10-02T10:00:00'

    SseMessageChunkData:
      type: object
      description: 'SSE `message_chunk` 事件的 data'
      required: [message_id, delta]
      properties:
        message_id:
          type: string
          description: 消息 ID（数字字符串）
          example: '456'
        delta:
          type: string
          description: 本次增量文本片段（前端逐字追加）
          example: 检索增强生成

    SseCitationData:
      type: object
      description: 'SSE `citation` 事件的 data'
      required: [message_id, index, material_id, title, page, snippet]
      properties:
        message_id:
          type: string
          description: 消息 ID（数字字符串）
          example: '456'
        index:
          type: integer
          format: int32
          description: 引用序号，从 1 开始
          example: 1
        material_id:
          type: integer
          format: int64
          description: 来源资料 ID
          example: 1
        title:
          type: string
          description: 来源资料名
          example: 操作系统笔记.pdf
        page:
          type: integer
          format: int32
          description: 页码
          example: 12
        snippet:
          type: string
          description: 命中片段原文
          example: 分页把逻辑地址空间切成固定大小的页…
        score:
          type: number
          format: float
          description: 相似度得分（0~1）
          example: 0.83

    SseMessageEndData:
      type: object
      description: 'SSE `message_end` 事件的 data（正常 / 中断 / 截断统一走此事件）'
      required: [message_id, finish_reason, tokens, elapsed_ms]
      properties:
        message_id:
          type: string
          description: 消息 ID（数字字符串）
          example: '456'
        finish_reason:
          type: string
          enum: [stop, aborted, length, error]
          description: 结束原因。stop=正常结束；aborted=用户中断；length=超长截断；error=异常终止
          example: stop
        tokens:
          type: integer
          format: int32
          description: 本次回答消耗的 token 数
          example: 328
        elapsed_ms:
          type: integer
          format: int32
          description: 本次生成耗时（毫秒）
          example: 2410

    SseErrorData:
      type: object
      description: 'SSE `error` 事件的 data；发出后服务端立即关闭连接'
      required: [code, message]
      properties:
        code:
          type: string
          description: 错误标识，字符串枚举，如 `AI_SERVICE_UNAVAILABLE` / `MODEL_TIMEOUT` / `MODEL_NOT_CONFIGURED`
          example: AI_SERVICE_UNAVAILABLE
        message:
          type: string
          description: 用户可读的错误原因
          example: AI 服务暂不可用，请稍后重试
        message_id:
          type: string
          description: 出错的消息 ID（数字字符串）；尚未开始生成时可能缺省
          example: '456'

    # ---------------------- 智能出题 ----------------------
    QuizGenerateRequest:
      type: object
      description: 组卷请求
      required: [count, types, difficulty]
      properties:
        course_id:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: 出题范围课程 ID；**0 = 全部资料**
          example: 1
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 20
          description: 题目数量，1~20
          example: 10
        types:
          type: array
          minItems: 1
          description: 题型集合，至少一种
          items:
            type: string
            enum: [SINGLE, MULTIPLE, FILL, ESSAY]
          example: [SINGLE, MULTIPLE, FILL]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
          description: 难度
          example: MEDIUM
        weak_points:
          type: array
          description: 可选，指定薄弱知识点优先出题
          items:
            type: string
          example: [分页机制]

    QuizCitationVO:
      type: object
      description: 题目附带的资料出处（比 CitationVO 少 index / score）
      required: [material_id, title, page, snippet]
      properties:
        material_id:
          type: integer
          format: int64
          description: 来源资料 ID
          example: 1
        title:
          type: string
          description: 来源资料名
          example: 操作系统笔记.pdf
        page:
          type: integer
          format: int32
          description: 页码
          example: 12
        snippet:
          type: string
          description: 命中片段原文
          example: 分页把逻辑地址空间切成固定大小的页…

    QuizQuestionVO:
      type: object
      description: 客户端视角的题目 —— **不含 `answer` / `explanation`**（防作弊）
      required: [id, type, stem, options, citations]
      properties:
        id:
          type: integer
          format: int64
          description: 题目 ID，提交作答时作为 answers 的 key
          example: 1
        type:
          type: string
          enum: [SINGLE, MULTIPLE, FILL, ESSAY]
          description: 题型
          example: SINGLE
        stem:
          type: string
          description: 题干
          example: 分页机制的作用是？
        options:
          type: array
          description: 选项文本数组。SINGLE / MULTIPLE 为 2~6 项；FILL / ESSAY 为 `[]`
          items:
            type: string
          example: [消除外部碎片, 减少页表项, 提高磁盘 IO, 降低缺页率]
        citations:
          type: array
          description: 题目依据的资料出处
          items:
            $ref: '#/components/schemas/QuizCitationVO'

    QuizGenerateVO:
      type: object
      description: 组卷结果（生成即建作答）
      required: [attempt_id, total, questions]
      properties:
        attempt_id:
          type: integer
          format: int64
          description: 作答记录 ID（`t_quiz_attempt.submitted_at` 为空 = 进行中）
          example: 55
        total:
          type: integer
          format: int32
          description: 题目总数
          example: 10
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuizQuestionVO'

    QuizSubmitRequest:
      type: object
      description: 提交作答请求
      required: [attempt_id, answers, duration_ms]
      properties:
        attempt_id:
          type: integer
          format: int64
          description: 作答记录 ID
          example: 55
        answers:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: |
            key 为 `String(question_id)`，**未作答的题不出现该键**。

            value：`SINGLE` / `FILL` / `ESSAY` 为字符串；`MULTIPLE` 为字符串数组。

            ⚠️ **选择题的作答值用「选项文本」而非 A/B/C/D 字母**（与 `options` 元素完全一致），避免标号与顺序耦合。
          example:
            '1': 消除外部碎片
            '2': [减少页表项, 提高磁盘 IO]
            '3': 页表
            '4': 简答文本
        duration_ms:
          type: integer
          format: int64
          minimum: 0
          description: 前端实测作答用时（毫秒）
          example: 420000

    QuizResultDetailVO:
      type: object
      description: 结果明细（含题干与选项回显，否则结果页无法复现题目）
      required:
        - question_id
        - type
        - stem
        - options
        - correct
        - user_answer
        - right_answer
        - explanation
        - citations
      properties:
        question_id:
          type: integer
          format: int64
          description: 题目 ID
          example: 1
        type:
          type: string
          enum: [SINGLE, MULTIPLE, FILL, ESSAY]
          description: 题型
          example: SINGLE
        stem:
          type: string
          description: 题干
          example: 分页机制的作用是？
        options:
          type: array
          description: 选项文本数组；FILL / ESSAY 为 `[]`
          items:
            type: string
        correct:
          type: boolean
          description: 本题是否判对。简答由模型评分，**≥ 0.6 视为正确**
          example: true
        user_answer:
          type: string
          nullable: true
          description: 用户作答的展示串；**未作答为 null**，多选为多个选项文本按「、」连接
          example: 消除外部碎片
        right_answer:
          type: string
          description: 正确答案的展示串；多选按「、」连接
          example: 消除外部碎片
        explanation:
          type: string
          description: 解析
          example: 分页把逻辑地址空间切成固定大小的页…
        citations:
          type: array
          description: 解析依据的资料出处
          items:
            $ref: '#/components/schemas/QuizCitationVO'

    QuizResultVO:
      type: object
      description: 作答结果
      required:
        - attempt_id
        - total
        - correct
        - score
        - duration_ms
        - details
        - weak_points_generated
      properties:
        attempt_id:
          type: integer
          format: int64
          description: 作答记录 ID
          example: 55
        total:
          type: integer
          format: int32
          description: 题目总数
          example: 10
        correct:
          type: integer
          format: int32
          description: 答对题数
          example: 8
        score:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: 百分制得分 = round(correct / total * 100)
          example: 80
        duration_ms:
          type: integer
          format: int64
          description: 作答用时（毫秒）
          example: 420000
        details:
          type: array
          items:
            $ref: '#/components/schemas/QuizResultDetailVO'
        weak_points_generated:
          type: array
          description: 本次作答识别出的薄弱知识点
          items:
            type: string
          example: [分页机制]

    QuizAttemptSummaryVO:
      type: object
      description: 历史作答记录列表项
      required: [id, course_id, course_name, total, correct, score, duration_ms, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: 作答记录 ID
          example: 55
        course_id:
          type: integer
          format: int64
          description: 所属课程 ID；0 表示全部资料
          example: 1
        course_name:
          type: string
          description: 课程名称
          example: 操作系统
        total:
          type: integer
          format: int32
          description: 题目总数
          example: 10
        correct:
          type: integer
          format: int32
          description: 答对题数
          example: 8
        score:
          type: integer
          format: int32
          description: 百分制得分
          example: 80
        duration_ms:
          type: integer
          format: int64
          description: 作答用时（毫秒）
          example: 420000
        created_at:
          type: string
          description: 交卷时间
          example: '2026-10-02T22:10:00'

    QuizAttemptPage:
      type: object
      description: 历史作答记录分页（只含已提交记录）
      required: [list, total, page, size]
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/QuizAttemptSummaryVO'
        total:
          type: integer
          format: int64
          description: 总条数
        page:
          type: integer
          format: int32
          description: 当前页码
        size:
          type: integer
          format: int32
          description: 每页条数

    WeakPointVO:
      type: object
      description: 薄弱知识点
      required: [point_name, score, weight]
      properties:
        point_name:
          type: string
          description: 知识点名称
          example: 分页机制
        score:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 掌握度（0~1），**越低越薄弱**
          example: 0.32
        weight:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 权重（该知识点在课程中的占比）
          example: 0.8

    WeakPointListVO:
      type: object
      description: 薄弱知识点排行（按 score 升序，最多 20 条）
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeakPointVO'

    # ---------------------- 学习统计 ----------------------
    StatsOverviewVO:
      type: object
      description: 个人总览指标
      required:
        - study_minutes_today
        - material_count
        - qa_count
        - qa_accuracy
        - quiz_accuracy
        - weak_point_count
      properties:
        study_minutes_today:
          type: integer
          format: int32
          description: 今日学习时长（分钟）
          example: 45
        material_count:
          type: integer
          format: int32
          description: 资料总数
          example: 12
        qa_count:
          type: integer
          format: int32
          description: 累计问答数
          example: 128
        qa_accuracy:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 问答命中率（0~1），前端转百分比
          example: 0.82
        quiz_accuracy:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 答题正确率（0~1），前端转百分比
          example: 0.76
        weak_point_count:
          type: integer
          format: int32
          description: 薄弱知识点数量
          example: 5

    TrendPointVO:
      type: object
      description: 趋势序列上的一个数据点
      required: [label, value]
      properties:
        label:
          type: string
          description: 展示刻度（如日期 `09-26`，饼图为分类名）
          example: '09-26'
        value:
          type: number
          format: float
          description: 数值，含义由 `unit` 决定
          example: 30

    TrendVO:
      type: object
      description: 趋势序列
      required: [type, range, unit, series]
      properties:
        type:
          type: string
          enum: [study_time, quiz_accuracy, qa_hit_rate, material_growth]
          description: 趋势类型（回显请求参数）
          example: study_time
        range:
          type: string
          enum: [week, month]
          description: 时间范围（回显请求参数；`qa_hit_rate` 忽略）
          example: week
        unit:
          type: string
          enum: [minute, ratio, count]
          description: 数值单位，**由后端决定，前端不得硬编码**
          example: minute
        series:
          type: array
          items:
            $ref: '#/components/schemas/TrendPointVO'

    ActivityVO:
      type: object
      description: 活动流条目。`title` 由后端在写入时拼好并落库，前端直接展示、不解析 payload。
      required: [id, type, target_id, target_type, title, created_at]
      properties:
        id:
          type: integer
          format: int64
          description: 活动 ID
          example: 1
        type:
          type: string
          enum:
            [
              COURSE_CREATED,
              MATERIAL_UPLOADED,
              MATERIAL_DELETED,
              QUIZ_SUBMITTED,
              CHAT_ASKED,
            ]
          description: |
            活动类型（前端只按此选图标）：

            - `COURSE_CREATED` 创建课程成功
            - `MATERIAL_UPLOADED` **资料解析完成（READY）时**写入（非上传完成时）
            - `MATERIAL_DELETED` 删除资料成功
            - `QUIZ_SUBMITTED` 交卷成功
            - `CHAT_ASKED` 会话内**首次**提问（每个会话只写一条）
          example: QUIZ_SUBMITTED
        target_id:
          type: string
          description: 关联目标 ID（字符串）
          example: '55'
        target_type:
          type: string
          description: 关联目标类型，如 COURSE / MATERIAL / QUIZ_ATTEMPT / CONVERSATION
          example: QUIZ_ATTEMPT
        title:
          type: string
          description: 可直接展示的文案
          example: 完成「操作系统」练习，答对 8 / 10 题（80 分）
        created_at:
          type: string
          description: 发生时间
          example: '2026-10-02T22:10:00'

    ActivityListVO:
      type: object
      description: 活动流
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ActivityVO'

    # ---------------------- 系统设置 ----------------------
    ModelConfigVO:
      type: object
      description: 大模型配置（**API Key 只回显掩码，永不返回明文**）
      required: [provider, base_url, model, api_key_masked, has_api_key, updated_at]
      properties:
        provider:
          type: string
          enum: [DEEPSEEK, OPENAI, QWEN, CUSTOM]
          description: 厂商预设；CUSTOM 表示任意 OpenAI 兼容端点
          example: DEEPSEEK
        base_url:
          type: string
          description: API 地址（OpenAI 兼容端点，通常以 /v1 结尾）
          example: https://api.deepseek.com/v1
        model:
          type: string
          description: 模型名
          example: deepseek-chat
        api_key_masked:
          type: string
          description: 密钥掩码，如 `sk-****f3a1`；未配置时为 `""`
          example: sk-****f3a1
        has_api_key:
          type: boolean
          description: 是否已配置密钥
          example: true
        updated_at:
          type: string
          nullable: true
          description: 最近保存时间；从未配置过为 null
          example: '2026-10-02T21:40:00'

    ModelConfigRequest:
      type: object
      description: 保存 / 测试大模型配置请求
      required: [provider, base_url, model]
      properties:
        provider:
          type: string
          enum: [DEEPSEEK, OPENAI, QWEN, CUSTOM]
          description: 厂商预设
          example: DEEPSEEK
        base_url:
          type: string
          maxLength: 300
          description: API 地址，必须为合法 URL，不超过 300 字
          example: https://api.deepseek.com/v1
        model:
          type: string
          maxLength: 100
          description: 模型名，1-100 字
          example: deepseek-chat
        api_key:
          type: string
          maxLength: 200
          description: |
            API Key。**省略或传 `""` 表示保留已保存的密钥**；传新值则覆盖。

            仅写入后端本地配置文件（`config/model-provider.json`，`0600`），不落库、不回显、不写日志。
          example: sk-xxxxxxxxxxxxxxxxxxxxxxxx

    ModelTestVO:
      type: object
      description: 探活结果（失败时 HTTP 仍为 200，用 `ok=false` 表达）
      required: [ok, latency_ms, message]
      properties:
        ok:
          type: boolean
          description: 是否连通
          example: true
        latency_ms:
          type: integer
          format: int32
          description: 探活耗时（毫秒）
          example: 186
        message:
          type: string
          description: 可读结果文案（成功含模型名；失败给出 Key 无效 / 地址不可达 / 模型不存在等原因）
          example: 连接成功，模型 deepseek-chat 可用