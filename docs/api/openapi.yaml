  # ============================== AI 问答 ==============================
  /ai/chat/stream:
    post:
      tags: [AI 问答]
      operationId: chatStream
      summary: 知识库问答（SSE 流式）
      description: |
        返回 `text/event-stream`。前端用 `fetch` + `ReadableStream` + `AbortController` 消费，逐字追加到消息。

        **未配置大模型时（3004）**：直接返回 `503` + `code=3004`，**不进入检索与模型调用**；前端在回答气泡内提示并给出「去设置」入口。

        **事件契约表（写死）**

        | event | 时机 | data 字段 |
        |---|---|---|
        | `message_start` | 会话就绪后立即发，**保证先于首个 token** | `message_id` `conversation_id` `created_at` |
        | `message_chunk` | 每个增量文本片段 | `message_id` `delta` |
        | `citation` | 引用片段就绪，可在任意 chunk 之间下发 | `message_id` `index` `material_id` `title` `page` `snippet` `score` |
        | `message_end` | 生成结束（正常/中断/截断统一走此事件） | `message_id` `finish_reason` `tokens` `elapsed_ms` |
        | `error` | 任意阶段异常，发出后服务端立即关闭连接 | `code` `message` `message_id` |

        `finish_reason` 枚举：`stop`（正常结束）| `aborted`（用户中断）| `length`（超长截断）| `error`（异常终止）。

        各类事件的 `data` 结构已单独建模，见模型库：`SseMessageStartData`、`SseMessageChunkData`、`SseCitationData`、`SseMessageEndData`、`SseErrorData`。

        **心跳与超时**：服务端每 15s 发送 SSE 注释行 `: ping`；前端静默超过 `VITE_SSE_IDLE_TIMEOUT_MS`（默认 30s）即判定连接失效，**保留已生成内容**并提示「回答中断」。

        **请求头**：`Authorization`、`Content-Type: application/json`、`Accept: text/event-stream`、`X-Request-Id`、`Cache-Control: no-cache`

        **响应头**：`Content-Type: text/event-stream; charset=utf-8`、`Cache-Control: no-cache`、`X-Accel-Buffering: no`、`Connection: keep-alive`

        首次提问会创建会话并写入一条 `t_activity(type=CHAT_ASKED)`（每个会话只写一条，避免刷屏）。
      parameters:
        - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: SSE 事件流（5 种事件，见接口说明）
          content:
            text/event-stream:
              schema:
                type: string
                description: 原始 SSE 文本流
              example: |
                event: message_start
                data: {"message_id":"456","conversation_id":"123","created_at":"2026-10-02T10:00:00"}

                event: message_chunk
                data: {"message_id":"456","delta":"RAG 的核心是"}

                event: message_chunk
                data: {"message_id":"456","delta":"检索增强生成"}

                event: citation
                data: {"message_id":"456","index":1,"material_id":1,"title":"操作系统笔记.pdf","page":12,"snippet":"...","score":0.83}

                event: message_end
                data: {"message_id":"456","finish_reason":"stop","tokens":328,"elapsed_ms":2410}

        '503':
          description: 大模型未配置（3004）或 AI 服务不可用（3001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiEnvelope'
              example:
                code: 3004
                message: 尚未配置大模型，请先在设置中完成配置
                data: null
                trace_id: 3f1a2b4c-5d6e-7f80-9a1b-2c3d4e5f6071

